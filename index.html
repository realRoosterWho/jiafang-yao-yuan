<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>甲方要圆</title>
<meta name="description" content="你是被外星甲方绑走的地球工匠：把所有东西砸成圆的。49 单敲击小游戏。">
<meta name="theme-color" content="#110d2b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2393e85a' stroke='%231e1747' stroke-width='3'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Fredoka:wght@500;700&display=swap">
<style>
/* 布局：单屏游戏。16:10 舞台居中占满可用空间，操作说明压在舞台下方一行。只做深色一套外观。 */
:root {
  color-scheme: dark;
  --space: #110d2b;    /* 深空底色 */
  --hull: #1e1747;     /* 舱壁、卡片 */
  --hull-hi: #2d2468;  /* 卡片里的内嵌面板 */
  --rim: #5143a0;      /* 描边 */
  --ink: #f4f0ff;      /* 正文 */
  --dim: #a9a1d6;      /* 次要文字 */
  --alien: #93e85a;    /* 甲方绿：达标、有效 */
  --coin: #ffd35c;     /* 酬劳、达标线 */
  --alarm: #ff5683;    /* 碎裂、失败 */
  --display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --num: "Fredoka", "PingFang SC", "Microsoft YaHei", sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  box-sizing: border-box;
  height: 100dvh;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--space);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  touch-action: manipulation; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; -webkit-touch-callout: none;
}
#app { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#wrap { flex: 1 1 0; min-height: 0; width: 100%; display: grid; place-items: center; }
* { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#stage {
  --u: 1px;
  position: relative;
  max-width: 100%;
  font-size: max(12px, calc(var(--u) * 16));
  border-radius: calc(var(--u) * 22);
  overflow: hidden;
  box-shadow: 0 0 0 2px var(--rim);
  background: var(--hull);
  user-select: none;
  -webkit-user-select: none;
}
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
#help { margin: 0; max-width: 72ch; font-size: 13px; line-height: 1.5; color: var(--dim); text-align: center; text-wrap: balance; }

#deliver {
  position: absolute; right: 10.5%; bottom: 2.6%;
  font: 400 max(13px, calc(var(--u) * 24))/1 var(--display);
  padding: .45em 1.1em; border: 0; border-radius: 999px;
  background: var(--alien); color: var(--space); cursor: pointer;
  animation: pulse 1s ease-in-out infinite alternate;
}
#deliver kbd { font: 500 .55em var(--num); opacity: .7; margin-left: .4em; }
#deliver .st { font: 400 .7em/1 var(--body); letter-spacing: .05em; margin-left: .45em; vertical-align: .08em; }
@keyframes pulse { to { box-shadow: 0 0 0 calc(var(--u) * 9) rgb(147 232 90 / .25); } }
#mute {
  position: absolute; left: 1.6%; bottom: 2.6%;
  font: 500 max(10px, calc(var(--u) * 13))/1 var(--body);
  padding: .5em .9em; border: 0; border-radius: 999px;
  background: transparent; color: var(--dim); box-shadow: inset 0 0 0 1px var(--rim); cursor: pointer;
}
#replay {
  position: absolute; left: 11.5%; bottom: 2.6%;
  font: 500 max(10px, calc(var(--u) * 13))/1 var(--body);
  padding: .5em .9em; border: 0; border-radius: 999px;
  background: transparent; color: var(--dim); box-shadow: inset 0 0 0 1px var(--rim); cursor: pointer;
}
#home {
  position: absolute; right: 10%; top: 16%;   /* 右上：圆度数字下面、力度表左边的空地。底部那排会被轮换的提示文字压到，顶部会碰到圆度数字 */
  font: 500 max(10px, calc(var(--u) * 13))/1 var(--body);
  padding: .5em .9em; border: 0; border-radius: 999px;
  background: transparent; color: var(--dim); box-shadow: inset 0 0 0 1px var(--rim); cursor: pointer;
}
#replay kbd, #home kbd { font: 500 .85em var(--num); opacity: .7; margin-left: .4em; }
.touch #replay kbd, .touch #home kbd { display: none; }
#replay:hover, #mute:hover, #home:hover { color: var(--ink); }
#deliver:focus-visible, #replay:focus-visible, #mute:focus-visible, #home:focus-visible, .btn:focus-visible { outline: 3px solid var(--coin); outline-offset: 3px; }

/* 卡片铺满整个视口而不是只铺舞台：窄屏时舞台很矮，卡片不能被舞台裁掉 */
#overlay {
  position: fixed; inset: 0; z-index: 5; display: flex; overflow: auto;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background: rgb(17 13 43 / .76);
  font-size: max(14px, calc(var(--u) * 16));
}
#card {
  box-sizing: border-box; margin: auto; width: min(100%, max(calc(var(--u) * 570), 26em));
  padding: 1.4em 1.7em 1.35em; display: flex; flex-direction: column; gap: .7em;
  background: var(--hull); border: 2px solid var(--rim); border-radius: 1.6em;
}
#card h1 { margin: 0; font: 400 3.1em/1 var(--display); letter-spacing: .05em; color: var(--alien); }
#card h2 { margin: 0; font: 400 1.9em/1.15 var(--display); text-wrap: balance; }
#card p { margin: 0; line-height: 1.6; }
#card p.why { padding: .6em .8em; border-radius: .6em; background: rgba(255,86,131,.12); box-shadow: inset 3px 0 0 var(--alarm); }
#card .red { color: var(--alarm); font-weight: 700; }
#card strong { color: var(--coin); font-weight: 600; }
.eyebrow { font-size: .8em; letter-spacing: .14em; color: var(--coin); }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: .5em; }
.how li { display: grid; grid-template-columns: auto 1fr; gap: .7em; align-items: start; line-height: 1.5; }
.how b {
  width: 1.55em; height: 1.55em; border-radius: 50%; display: grid; place-items: center;
  font: 400 1.2em/1 var(--display); background: var(--hull-hi); color: var(--coin);
}
.how span { min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: .7em; align-items: center; }
.btn {
  font: 400 1.3em/1 var(--display); padding: .55em 1.6em; border: 0; border-radius: 999px;
  background: var(--alien); color: var(--space); cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--rim); }
.spec {
  margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .4em 1.1em; align-items: center;
  padding: .8em 1em; border-radius: 1em; background: var(--hull-hi); font-size: .92em;
}
.spec dt { color: var(--dim); }
.spec dd { margin: 0; min-width: 0; font-variant-numeric: tabular-nums; }
.spec.tally dd { text-align: right; font-family: var(--num); }
.spec .sum { font-size: 1.5em; color: var(--coin); }
.window { display: flex; height: 1em; border-radius: 999px; overflow: hidden; }
.window i { display: block; }
.w-light { background: var(--rim); }
.w-ok { background: var(--alien); }
.w-break { background: var(--alarm); }
.pips { letter-spacing: .15em; color: var(--coin); margin-right: .5em; }
/* 星级 */
.nw { white-space: nowrap; }
.stars { color: var(--coin); letter-spacing: .08em; white-space: nowrap; font-family: var(--body); }
/* 结算卡：三颗星排成一道弧，中间那颗大一号；拿到的从 0 弹出来，带一圈光 */
#card.win { animation: cardin .38s cubic-bezier(.2, 1.3, .4, 1) both; box-shadow: 0 0 0 1px rgb(255 211 92 / .25), 0 1.2em 3em rgb(0 0 0 / .45); }
@keyframes cardin { from { transform: translateY(1.2em) scale(.94); opacity: 0; } }
.result { display: grid; justify-items: center; text-align: center; gap: .35em; }
.result h2 { margin-top: -.1em; }
.stars.big { display: flex; align-items: flex-end; justify-content: center; gap: .08em; margin: .1em 0 0; font-size: 3.4em; line-height: 1; letter-spacing: 0; }
.stars.big i { font-style: normal; color: var(--hull-hi); -webkit-text-stroke: 2px var(--rim); display: inline-block; }
.stars.big i:nth-child(2) { font-size: 1.32em; transform: translateY(-.12em); }
.stars.big i.on { color: var(--coin); -webkit-text-stroke: 0; text-shadow: 0 0 .25em rgb(255 211 92 / .55), 0 .06em 0 #c98a12; animation: starpop .5s cubic-bezier(.3, 1.7, .5, 1) both; animation-delay: calc(var(--k) * .18s); }
.stars.big i.on:nth-child(2) { animation-name: starpop2; }
@keyframes starpop { from { transform: scale(0) rotate(-50deg); opacity: 0; } }
@keyframes starpop2 { from { transform: translateY(-.12em) scale(0) rotate(-50deg); opacity: 0; } }
.rnd { color: var(--dim); font-size: .95em; }
.rnd b { font: 400 1.5em/1 var(--display); color: var(--alien); margin-left: .2em; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: .4em; }
.chip { padding: .2em .7em; border-radius: 999px; font-size: .85em; background: var(--hull-hi); color: var(--coin); box-shadow: inset 0 0 0 1.5px rgb(255 211 92 / .45); }
.chip.gold { background: var(--coin); color: var(--space); box-shadow: none; font-weight: 700; animation: chippop .5s .9s cubic-bezier(.3, 1.8, .5, 1) both; }
@keyframes chippop { from { transform: scale(0); } }
.spec .sum.done { animation: sumpop .3s ease-out; transform-origin: right center; }
@keyframes sumpop { 50% { transform: scale(1.18); color: #fff3b0; } }
.lv i { font-style: normal; font-size: .62em; line-height: 1; letter-spacing: .02em; color: var(--coin); min-height: 1em; }
.lv i.dim { color: var(--rim); }
.note { font-size: .85em; color: var(--dim); }
/* 排行榜 */
.board { margin: 0; padding: 0; list-style: none; display: grid; gap: .2em; max-height: min(52vh, 24em); overflow-y: auto; }
.board li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto auto; gap: .8em; align-items: center; padding: .45em .8em; border-radius: .8em; background: var(--hull-hi); font-variant-numeric: tabular-nums; }
.board li b { font: 400 1.15em/1 var(--display); color: var(--coin); text-align: center; }
.board li:nth-child(-n+3) b { font-size: 1.4em; }
.board .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .dl { color: var(--dim); font-size: .85em; }
.board .pt { font-family: var(--num); color: var(--coin); }
.board li.me { box-shadow: inset 0 0 0 2px var(--alien); }
.board.mine { max-height: none; }
/* 云存档 */
.who { display: grid; gap: .45em; margin: 0; }
.who-row { display: flex; gap: .5em; align-items: center; }
.who input {
  flex: 1 1 8em; min-width: 0; font: inherit; font-size: max(16px, 1em); padding: .5em .95em; border: 0; border-radius: 999px;
  background: var(--hull-hi); color: var(--ink); box-shadow: inset 0 0 0 2px var(--rim); -webkit-user-select: text; user-select: text;
}
.who input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--alien); }
.who input::placeholder { color: var(--dim); }
.btn.small { font-size: 1.05em; padding: .5em 1.2em; flex: none; }
.btn:disabled { opacity: .55; cursor: default; }
.who .err { color: var(--alarm); }
.link { font: inherit; padding: 0; border: 0; background: none; color: var(--alien); text-decoration: underline; text-underline-offset: .2em; cursor: pointer; }
/* 订单簿 */
.chap { font-size: .8em; letter-spacing: .1em; color: var(--dim); }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .3em; margin-top: -.4em; }
.lv {
  display: grid; justify-items: center; gap: .3em; min-width: 0; padding: .4em 0;
  border: 0; border-radius: .8em; background: transparent; color: var(--dim); font: inherit; cursor: pointer;
}
.lv b {
  width: 2.3em; height: 2.3em; border-radius: 50%; display: grid; place-items: center;
  font: 700 1em/1 var(--num); background: var(--hull-hi); box-shadow: inset 0 0 0 2px var(--rim);
}
.lv span { font-size: .75em; line-height: 1.2; white-space: nowrap; }
.lv.done { color: var(--ink); }
.lv.done b { background: var(--alien); color: var(--space); box-shadow: none; }
.lv.now b { color: var(--coin); box-shadow: inset 0 0 0 2px var(--coin); }
.lv:hover { background: var(--hull-hi); }
.lv:focus-visible { outline: 3px solid var(--coin); outline-offset: 1px; }
/* 触屏的微调角度：一只手拎着材料，另一只手按这两个键（或者在画面上左右滑） */
#rot { display: none; position: absolute; left: 2%; top: 56%; flex-direction: column; gap: calc(var(--u) * 14); }
#rot button {
  width: max(44px, calc(var(--u) * 64)); height: max(44px, calc(var(--u) * 64)); border-radius: 50%; border: 0; padding: 0;
  font: 400 max(22px, calc(var(--u) * 34))/1 var(--body); color: var(--ink); background: rgb(17 13 43 / .55);
  box-shadow: inset 0 0 0 1.5px var(--rim); opacity: .5; touch-action: none; user-select: none; -webkit-user-select: none;
}
#stage.held #rot button { opacity: 1; }
#rot button.on { background: var(--rim); }
/* 竖屏手机：舞台换成竖版，按钮跟着放大 */
#stage.port #deliver { right: 17%; bottom: calc(var(--u) * (var(--bot) + 8)); font-size: max(15px, calc(var(--u) * 30)); }
#stage.port #mute { bottom: calc(var(--u) * (var(--bot) + 10)); font-size: max(11px, calc(var(--u) * 17)); }
#stage.port #replay { left: 24%; bottom: calc(var(--u) * (var(--bot) + 10)); font-size: max(11px, calc(var(--u) * 17)); }
#stage.port #home { right: 2%; top: 14.8%; font-size: max(11px, calc(var(--u) * 17)); }   /* 竖屏：酬劳那行下面、甲方气泡右边 */
.touch #deliver kbd { display: none; }
#stage.cover #rot { display: none; }
/* 触屏：小按钮至少 44 像素高，好按 */
.touch #mute, .touch #replay, .touch #home { min-height: 44px; min-width: 44px; }
.touch .lv { min-height: 44px; }
@media (max-height: 520px) { #help { display: none; } body { padding-top: 6px; padding-bottom: 6px; } }
/* 成就：圆章没解锁是方的灰块，解锁了是圆的金章。提示条里那一下「方块被砸圆」就是解锁 */
.medal { flex: none; display: grid; place-items: center; width: 1.9em; height: 1.9em; border-radius: .32em; font: 700 .9em/1 var(--num); color: var(--dim);
  background: var(--hull); box-shadow: inset 0 0 0 2px var(--rim); }
.medal.on, #toast .medal { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, var(--coin) 45%, #d99a1c); box-shadow: inset 0 0 0 .2em rgb(255 255 255 / .25), inset 0 0 0 .32em rgb(122 82 0 / .35), 0 0 .6em rgb(255 211 92 / .35); }
#toast { box-sizing: border-box; position: absolute; z-index: 3; left: 46%; bottom: 2.2%; transform: translateX(-50%);
  display: flex; align-items: center; gap: .6em; max-width: calc(var(--u) * 420); padding: .38em 1.1em .38em .42em;
  border-radius: 999px; font: 400 max(12px, calc(var(--u) * 17))/1.15 var(--display); white-space: nowrap;
  background: rgb(30 23 71 / .95); color: var(--ink); box-shadow: inset 0 0 0 2px var(--coin), 0 6px 18px rgb(0 0 0 / .35); pointer-events: none; }
#toast .medal { width: 1.75em; height: 1.75em; }
#toast .tx { display: flex; align-items: baseline; gap: .55em; min-width: 0; }
#toast .tl { flex: none; font: 500 .62em var(--body); letter-spacing: .14em; color: var(--coin); }
#toast .tn { overflow: hidden; text-overflow: ellipsis; }
#toast .td { display: none; }
#stage.port #toast { left: 50%; bottom: auto; top: calc(var(--u) * 102); max-width: calc(var(--u) * 262); font-size: max(12px, calc(var(--u) * 16)); }
#stage.port #toast .medal { width: 1.5em; height: 1.5em; }
:lang(en) #stage.port #toast .tl { display: none; }
/* 不在干活时：钉在页面顶上，多一行描述 */
#stage #toast.menu, #stage.port #toast.menu { position: fixed; z-index: 6; top: max(12px, env(safe-area-inset-top, 0px)); bottom: auto; left: 50%;
  width: max-content; max-width: min(26em, calc(100vw - 32px)); font-size: 17px; white-space: normal; padding: .6em 1.3em .6em .6em; border-radius: 1.4em; }
#stage #toast.menu .medal, #stage.port #toast.menu .medal { width: 2.4em; height: 2.4em; }
#toast.menu .tx { flex-direction: column; align-items: flex-start; gap: .2em; }
#toast.menu .td { display: block; font: 400 .78em/1.45 var(--body); color: var(--dim); }
:lang(en) #stage.port #toast.menu .tl { display: inline; }
#toast.in { animation: achIn .26s cubic-bezier(.2, 1.4, .4, 1) both; }
#toast.in .medal { animation: stamp .42s .1s cubic-bezier(.3, 1.6, .5, 1) both; }
#toast.out { animation: achOut .28s ease-in both; }
@keyframes achIn { from { opacity: 0; transform: translate(-50%, 40%) scale(.9); } }
@keyframes achOut { to { opacity: 0; transform: translate(-50%, -30%); } }
@keyframes stamp { from { border-radius: .3em; background: var(--rim); box-shadow: none; transform: scale(1.6) rotate(-45deg); } }
/* 成就列表（成就页、结算卡上的「新成就」） */
.achs { margin: 0; padding: 0; list-style: none; display: grid; gap: .3em; }
.achs li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .75em; align-items: center; padding: .5em .8em; border-radius: .9em; background: var(--hull-hi); }
.achs li > span:not([class]) { display: grid; gap: .15em; min-width: 0; }
.achs .nm { font: 400 1.08em/1.2 var(--display); }
.achs .ds { font-size: .82em; line-height: 1.45; color: var(--dim); }
.achs .when, .achs .pg { font: 500 .78em var(--num); color: var(--dim); white-space: nowrap; }
.achs .bar { display: block; height: .3em; margin-top: .2em; border-radius: 999px; background: var(--hull); overflow: hidden; }
.achs .bar i { display: block; height: 100%; background: var(--coin); border-radius: inherit; }
.achs li:not(.on) .nm { color: var(--dim); }
.achs li.secret .ds { font-style: italic; }
.achs .new { font: 700 .55em/1 var(--body); font-style: normal; vertical-align: .35em; margin-left: .5em; padding: .2em .45em; border-radius: 999px; background: var(--alarm); color: #fff; }
.ach-new { display: grid; gap: .45em; }
.ach-new .achs li { box-shadow: inset 0 0 0 2px rgb(255 211 92 / .45); animation: achRow .45s cubic-bezier(.2, 1.3, .4, 1) both; animation-delay: calc(1.1s + var(--i) * .12s); }
.ach-new .achs li .medal { animation: stamp .45s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: calc(1.18s + var(--i) * .12s); }
@keyframes achRow { from { opacity: 0; transform: translateY(.6em); } }
.btn .cnt { font: 500 .7em var(--num); opacity: .75; }
.btn .dot { display: inline-block; width: .42em; height: .42em; margin-left: .35em; vertical-align: .5em; border-radius: 50%; background: var(--alarm); }
@media (prefers-reduced-motion: reduce) { #deliver, .stars.big i.on, #card.win, .chip.gold, .spec .sum.done, #toast.in, #toast.out, #toast .medal, .ach-new .achs li, .ach-new .achs li .medal { animation: none; } }
/* ================= 休闲宇宙风界面（ui-crispkit 分支）=================
   上面的规则一条没动，这一段只盖外观。素材主要来自 casual_space_ui_kit（脚本里的 SK_SVG，名字以 s 开头，开局由 kitBoot 塞进 --k-名字）：
   按钮、图标按钮、弹窗、星星；那套里没有的（订单簿的关卡格、内嵌面板、输入框）还用 CrispKit，调成同一套金 / 绿 / 奶油色。
   卡片里把颜色变量换成奶油底深棕字那一套，原有的规则（星级、成就、订单簿……）就都跟着变了。舞台上（深色底）的变量不动，flow.js 也在用。
   电脑和手机分开适配：电脑上图标按钮小一号、右下角挂快捷键的小键帽、鼠标停上去会弹；手机上图标按钮放大到好按、没有键帽，卡片里的按钮加高、一行放两个。 */
:root { --space: #171a5c; --k-ink: #653616; --k-soft: #a8794a; --orange: #f08a1c; --orange-lo: #c96a0c; --tan: #f0cf9c; --cream: #fffdf6; --cream-lo: #ffecd0; --pop: cubic-bezier(.3, 1.8, .5, 1); }
#stage { --ib: max(36px, calc(var(--u) * 54)); box-shadow: 0 0 0 max(2px, calc(var(--u) * 3)) #8b93f5, 0 calc(var(--u) * 10) calc(var(--u) * 30) rgb(8 8 50 / .5); }
.touch #stage { --ib: max(44px, calc(var(--u) * 54)); }
#stage.port { --ib: max(44px, calc(var(--u) * 72)); }
/* 按钮：素材包的胶囊按钮。绿 = 往前走（接单、下一单、交货），金 = 其他，粉 = 回首页，蓝 = 重来。碰一下往上弹，按下去往里缩。
   图切成左头、右头、中段三层背景（见 kitBoot）：两头按按钮的高等比放，中段横着拉、往两头底下多伸一点，不露缝 */
.btn, #deliver, #stage #flow-lang, #card > .eyebrow:first-child, #card > .result:first-child > .eyebrow:first-child {
  border: 0; border-radius: .9em; box-shadow: none; padding: .68em 1.3em .74em;
  background: var(--k-sBtnGreenL) left / auto 100% no-repeat, var(--k-sBtnGreenR) right / auto 100% no-repeat, var(--k-sBtnGreenM) center / calc(100% - 1.8em) 100% no-repeat;
  color: #2c6a20; text-shadow: 0 .06em 0 rgb(255 255 255 / .55); transition: transform .18s var(--pop), filter .15s;
}
.btn.small { padding: .68em 1.15em .74em; }
#card .btn:not(.ghost):not(.flow-big) { font-size: 1.5em; }
#card .btn.ghost { font-size: 1.05em; }
#card .btn.ghost.small { font-size: .95em; }
.btn:hover { transform: translateY(-.12em) scale(1.05); filter: brightness(1.07); }
.btn:active { transform: translateY(.1em) scale(.96); filter: brightness(.95); }
.btn.ghost, #stage #flow-lang, #card > .eyebrow:first-child, #card > .result:first-child > .eyebrow:first-child {
  background: var(--k-sBtnGoldL) left / auto 100% no-repeat, var(--k-sBtnGoldR) right / auto 100% no-repeat, var(--k-sBtnGoldM) center / calc(100% - 1.8em) 100% no-repeat; color: #96490f; box-shadow: none; }
.btn:disabled { background-image: var(--k-sBtnOffL), var(--k-sBtnOffR), var(--k-sBtnOffM); color: #777397; text-shadow: none; transform: none; filter: none; opacity: 1; }
.btn .cnt { opacity: .8; }
/* 交货：绿的，一边发光一边轻轻晃 */
#deliver { padding: .68em 1.2em .74em; animation: pulse .55s ease-in-out infinite alternate; }
#deliver:hover { filter: brightness(1.07); }
#deliver:active { filter: brightness(.95); }
#deliver kbd { opacity: .75; }
@keyframes pulse { from { transform: rotate(-2deg) scale(1); } to { transform: rotate(2deg) scale(1.08); filter: drop-shadow(0 0 calc(var(--u) * 9) rgb(170 255 120 / .75)); } }
#deliver:focus-visible, #replay:focus-visible, #mute:focus-visible, #home:focus-visible, .btn:focus-visible { outline-color: #fff; }
/* 舞台上的三个小按钮：素材包的方形图标按钮，字收起来（读屏还读得到）。大小是 --ib：电脑小一号，触屏至少 44 像素，手机竖屏再大一圈 */
#mute, #replay, #home, #stage.port #mute, #stage.port #replay, #stage.port #home {
  box-sizing: border-box; width: var(--ib); height: var(--ib); padding: 0; border: 0; border-radius: 30%; box-shadow: none;
  background: var(--k-sIcoSound) center / 100% 100% no-repeat; font-size: 0; color: transparent; overflow: visible;
  transition: transform .18s var(--pop), filter .15s;
}
#mute[aria-pressed="true"], #stage.port #mute[aria-pressed="true"] { background-image: var(--k-sIcoMute); }
#replay, #stage.port #replay { background-image: var(--k-sIcoRestart); }
#home, #stage.port #home { background-image: var(--k-sIcoHome); }
/* 位置（照排布参考图）：声音、重来在左下角，跟中间的提示条、右下角的交货按钮排成底部一条控制带；回首页在右上角。
   电脑上回首页正好坐在力度计的头顶上；手机竖屏在顶栏的右上角，两个小按钮贴着左下角 */
/* 对齐：四边留一样的边距（电脑 14、手机 8，单位是画面上的 1 格 = --u）。图标按钮的图四周有 5% 的透明边，所以盒子往外多放一点，看得见的边才落在线上。
   左边：声音按钮跟舷窗、订单卡的左边齐；右边：回首页跟力度计的右边齐；上边：回首页跟目标栏小牌子的上沿齐；
   下边：两个图标按钮、提示条、交货按钮上下都对在同一条线上（中线 y = 563） */
#mute { left: calc(var(--u) * 11.3); bottom: calc(var(--u) * 10); }
#replay { left: calc(var(--u) * 21.3 + var(--ib)); bottom: calc(var(--u) * 10); }
#home { right: calc(var(--u) * 11.3); top: calc(var(--u) * 10); }
#deliver { right: calc(var(--u) * 91); bottom: calc(var(--u) * 8); }
#stage.port #mute { left: calc(var(--u) * 4.4); }
#stage.port #replay { left: calc(var(--u) * 12.4 + var(--ib)); }
#stage.port #home { right: calc(var(--u) * 4.4); top: calc(var(--u) * 15); }
#stage.port #deliver { right: calc(var(--u) * 5); }
/* 舞台下面那行说明收掉：操作提示只留舞台里那一条轮换的提示条，不要两层 */
#help { display: none; }
/* 开始界面（封面）：按钮都居中在一条竖线上，大按钮在标题下面，下面一排小的；右下角换语言，左下角声音，两个角上下对齐。
   画布上的标题和木头见 drawCover，按钮是脚本里的 startSync 写进 #startui 的 */
#startui { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
#stage:not(.cover) #startui { display: none; }
#startui .btn { pointer-events: auto; }
.start-main { position: absolute; left: 0; right: 0; top: 67%; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 14); }
.start-go { font-size: max(18px, calc(var(--u) * 32)); min-width: 6.2em; animation: startpulse 1.1s ease-in-out infinite alternate; }
@keyframes startpulse { to { transform: scale(1.06); filter: brightness(1.05) drop-shadow(0 0 calc(var(--u) * 10) rgb(170 255 120 / .65)); } }
.start-more { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 10); padding: 0 4%; }
.start-more .btn, .start-lang, #stage #flow-lang { font-size: max(13px, calc(var(--u) * 18)); }
.start-lang, #stage #flow-lang { position: absolute; right: calc(var(--u) * 12); bottom: calc(var(--u) * 11); }
/* flow.js 给新玩家放在封面上的换语言按钮：换成一样的金色按钮；这时候我们自己的那个和下面一排小按钮都收起来（新玩家先看开场、签合同） */
#stage #flow-lang { font-family: var(--display); font-weight: 400; line-height: 1; }
#stage:not(.seen):has(#flow-lang) .start-more, #stage:not(.seen):has(#flow-lang) .start-lang { display: none; }
#stage.seen #flow-lang { display: none; }   /* 这一次打开以后已经离开过开始界面（.seen，showCover 第二次起加上）：开场流程走过了，按钮全给，换语言用我们自己的 */
#stage.port .start-main { top: 56%; gap: calc(var(--u) * 18); }
#stage.port .start-go { font-size: max(18px, calc(var(--u) * 40)); }
#stage.port .start-more .btn, #stage.port .start-lang, #stage.port #flow-lang { font-size: max(13px, calc(var(--u) * 24)); }
#stage.port .start-lang, #stage.port #flow-lang { right: calc(var(--u) * 6); bottom: calc(var(--u) * 10); }
#stage.cover.port #mute { bottom: calc(var(--u) * 10); }
#mute:hover, #replay:hover, #home:hover { transform: translateY(-6%) scale(1.08); filter: brightness(1.07); color: transparent; }
#mute:active, #replay:active, #home:active { transform: translateY(4%) scale(.93); filter: brightness(.95); }
/* 电脑上：图标按钮右下角挂一个小键帽，写着快捷键。触屏没有键盘，不显示（上面 .touch 那条规则管着） */
#replay kbd, #home kbd { position: absolute; right: -16%; bottom: -10%; margin: 0; opacity: 1; padding: .2em .42em; border-radius: .55em; pointer-events: none;
  font: 700 max(9px, calc(var(--u) * 11))/1 var(--num); color: var(--k-ink); background: linear-gradient(#fffef8, #ffe6bd); box-shadow: 0 0 0 1.5px #fff, 0 .15em .35em rgb(20 16 80 / .4); }
#rot button { color: #fff; background: var(--k-badgeGold) center / 100% 100% no-repeat; box-shadow: none; }
/* 卡片：素材包的弹窗（紫边、奶油色的底），冒出来的时候弹一下 */
#overlay { background: rgb(22 20 92 / .7); }
#card, #card.win {
  --hull: var(--cream); --hull-hi: var(--cream-lo); --rim: var(--tan); --ink: var(--k-ink); --dim: var(--k-soft); --coin: var(--orange); --alien: #2f9e3a; --alarm: #e0355e; --space: #ffffff;
  color: var(--ink); border: 0; border-radius: 0; box-shadow: none; filter: drop-shadow(0 .8em 1.2em rgb(10 8 60 / .45)); padding: 1.95em 1.7em 1.85em;
  /* 弹窗的图切成九块，各当一层背景：四个角不变形，四条边和中间拉伸，往角的底下多伸一点，不露缝 */
  background:
    var(--k-sPopupTL) left top / 2em 2.45em no-repeat, var(--k-sPopupTR) right top / 2em 2.45em no-repeat,
    var(--k-sPopupBL) left bottom / 2em 2.2em no-repeat, var(--k-sPopupBR) right bottom / 2em 2.2em no-repeat,
    var(--k-sPopupT) center top / calc(100% - 3.9em) 2.45em no-repeat, var(--k-sPopupB) center bottom / calc(100% - 3.9em) 2.2em no-repeat,
    var(--k-sPopupL) left 0 top 2.4em / 2em calc(100% - 4.55em) no-repeat, var(--k-sPopupR) right 0 top 2.4em / 2em calc(100% - 4.55em) no-repeat,
    var(--k-sPopupC) 1.95em 2.4em / calc(100% - 3.9em) calc(100% - 4.55em) no-repeat;
}
#card { animation: cardpop .34s var(--pop) both; }
@keyframes cardpop { from { transform: scale(.86) translateY(.8em); opacity: 0; } }
/* 第一行小标题做成一块金色的标题牌，骑在弹窗的上沿（素材包的示例里那儿是三颗星） */
#card > .eyebrow:first-child, #card > .result:first-child > .eyebrow:first-child {
  box-sizing: border-box; align-self: center; justify-self: center; width: fit-content; max-width: 100%; margin: -2.35em auto 0; padding: .62em 1.35em .7em; text-align: center;
  font-size: 1em; font-weight: 700; line-height: 1.25; letter-spacing: .12em; color: #8a4310; text-shadow: 0 .06em 0 rgb(255 255 255 / .5);
}
#card h1 { color: var(--orange); text-shadow: 0 .05em 0 #fff, 0 .1em 0 rgb(201 106 12 / .4); }
#card strong { font-weight: 700; }
.how b { color: #8a4310; background: var(--k-badgeGold) center / 100% 100% no-repeat; text-shadow: 0 .05em 0 rgb(255 255 255 / .5); }
.row { gap: .55em; padding-top: .15em; }
/* 内嵌面板、输入框 */
.spec { background: none; border-radius: 0; border-style: solid; border-color: transparent; border-width: .9em; border-image: var(--k-insetCream) 16 fill / .9em stretch; padding: 0 .15em; }
.who input { background: none; box-shadow: none; border-radius: .8em; border-style: solid; border-color: transparent; border-width: .7em .85em; border-image: var(--k-inputCream) 16 fill / .8em stretch; padding: 0 .15em; }
.who input:focus { box-shadow: none; outline: 3px solid var(--orange); outline-offset: -1px; }
.window { height: 1.15em; background: #292c79; box-shadow: inset 0 0 0 2px #999ceb; }
.w-light { background: linear-gradient(#f2f9ff, #bfe0ff); }
.w-ok { background: linear-gradient(#c9f58f, #46c846); }
.w-break { background: linear-gradient(#ffb0b6, #ff5270); }
.link { color: var(--orange-lo); }
/* 星星：素材包的金星和灰星。结算卡上那三颗原来的弹出动画照旧 */
.stars, .lv i { color: #ffab1e; }
.lv i.dim { color: #e6c79a; }
.stars.big i { color: transparent; -webkit-text-stroke: 0; background: var(--k-sStar0) 50% 60% / 138% 138% no-repeat; width: 1em; height: 1em; overflow: hidden; }
.stars.big i.on { color: transparent; text-shadow: none; background-image: var(--k-sStar); filter: drop-shadow(0 0 .12em rgb(255 200 60 / .7)); }
.result .stars.big { margin-top: .32em; }
.rnd b { color: #2f9e3a; }
.chip { background: #fff; color: var(--orange-lo); box-shadow: inset 0 0 0 1.5px var(--tan); }
.chip.gold { background: linear-gradient(#ffd759, #ffab34); color: #8a4310; box-shadow: none; }
.board li.me { background: #dff7c8; }
.achs .bar { background: #fff; }
/* 订单簿：每一单是一块关卡格。交付过的是绿的，该做的下一单是金色的、会轻轻晃，其余是奶油色的（不是锁，哪一单都能点） */
.lv b { width: 2.5em; height: 2.75em; padding-bottom: .28em; box-sizing: border-box; border-radius: 0; box-shadow: none; color: var(--k-soft); background: var(--k-tilePale) center / 100% 100% no-repeat; transition: transform .18s var(--pop); }
.lv.done b { color: #fff; background: var(--k-tileDone) center / 100% 100% no-repeat; box-shadow: none; text-shadow: 0 .07em 0 rgb(40 130 40 / .7); }
.lv.now b { color: #8a4310; background-image: var(--k-tileNow); box-shadow: none; text-shadow: 0 .05em 0 rgb(255 255 255 / .5); animation: wig .6s ease-in-out infinite alternate; }
@keyframes wig { from { transform: rotate(-4deg); } to { transform: rotate(4deg) scale(1.06); } }
.lv:hover b { transform: translateY(-.14em) scale(1.1); }
/* 成就提示条：一块奶油色的小牌子 */
#toast { --ink: var(--k-ink); --dim: var(--k-soft); --coin: var(--orange); --rim: var(--tan); --hull: var(--cream);
  color: var(--ink); background: linear-gradient(#fffef8, #fff1d6 64%, #ffddac); box-shadow: 0 0 0 2.5px #fff, 0 6px 16px rgb(10 8 60 / .35); }
/* 手机（触屏 / 窄屏）：卡片里的按钮加高好按；一行放两个，单出来的一个占满一行 */
.touch .btn { min-height: 46px; }
@media (max-width: 560px) {
  #card, #card.win { padding: 1.95em 1.35em 1.7em; }
  #card .row > .btn { flex: 1 1 42%; }
  #card .row > .btn:not(.ghost) { flex-basis: 100%; }
  #card .row > .btn.small { flex: none; }
}
/* 三颗星到手：舞台外面泛一圈彩虹光（画面里面那圈是画布上画的，见 drawEdgeGlow） */
#stage.star3 { animation: halo 3s linear infinite; }
@keyframes halo {
  0%, 100% { box-shadow: 0 0 0 2px #ff5f7e, 0 0 calc(var(--u) * 36) calc(var(--u) * 6) rgb(255 95 126 / .7); }
  17% { box-shadow: 0 0 0 2px #ffa94d, 0 0 calc(var(--u) * 44) calc(var(--u) * 8) rgb(255 169 77 / .7); }
  33% { box-shadow: 0 0 0 2px #ffe066, 0 0 calc(var(--u) * 36) calc(var(--u) * 6) rgb(255 224 102 / .7); }
  50% { box-shadow: 0 0 0 2px #5fe3a1, 0 0 calc(var(--u) * 44) calc(var(--u) * 8) rgb(95 227 161 / .7); }
  67% { box-shadow: 0 0 0 2px #5ab8ff, 0 0 calc(var(--u) * 36) calc(var(--u) * 6) rgb(90 184 255 / .7); }
  83% { box-shadow: 0 0 0 2px #b28cff, 0 0 calc(var(--u) * 44) calc(var(--u) * 8) rgb(178 140 255 / .7); }
}
@media (prefers-reduced-motion: reduce) {
  #stage.star3 { animation: none; box-shadow: 0 0 0 2px #ffe066, 0 0 calc(var(--u) * 36) calc(var(--u) * 6) rgb(255 224 102 / .6); }
  #card, .lv.now b, .start-go { animation: none; } .btn, #mute, #replay, #home, #deliver, .lv b { transition: none; }
}
</style>

<body>

<main id="app">
  <div id="wrap">
    <div id="stage">
      <canvas id="cv" aria-label="游戏画面：材料、地板、甲方和力度表"></canvas>
      <button id="deliver" type="button" hidden>交货<span class="st"></span><kbd>空格</kbd></button>
      <button id="mute" type="button" aria-pressed="false">声音 开</button>
      <button id="replay" type="button" hidden>重来<kbd>R</kbd></button>
      <button id="home" type="button" hidden>回首页<kbd>Esc</kbd></button>
      <div id="toast" role="status" aria-live="polite" hidden></div>
      <div id="rot"><button id="rotL" type="button" aria-label="向左转">↺</button><button id="rotR" type="button" aria-label="向右转">↻</button></div>
      <div id="overlay" hidden><section id="card"></section></div>
    </div>
  </div>
  <p id="help">按住拎起来砸地板 · A / D 转 · 空格交货</p>
</main>

<script>
(() => {
'use strict';

/* ---------- 常量 ---------- */
const W = 960, H = 600, FLOOR = 520, WALL_R = 880;
// 竖屏时只看世界的右半边（房间变窄、力度表还在右侧），顶上多出 TOP 高的一条放甲方和圆度条
let WALL_L = 0, PORT = false, VW = W, VH = H, CAMX = 0, TOP = 0, BOT = 0;   // BOT：竖屏底部放横版力度表的一条，拎材料的手不会挡住
const midX = () => (WALL_L + WALL_R) / 2;
// 触屏判断：有的手机浏览器不报 hover:none，所以再看触点数，只要没有精确指针（鼠标）就当触屏
const mq = q => !!(window.matchMedia && matchMedia(q).matches);
const TOUCH = mq('(hover: none) and (pointer: coarse)') || ((navigator.maxTouchPoints > 0 || 'ontouchstart' in window) && !mq('(hover: hover) and (pointer: fine)'));
// 语言：网址里的 ?lang= 优先，其次是上次选的，最后看浏览器语言。L(中文, 英文) 就地取词
const LANG = (() => { try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'zh') return q; const v = localStorage.getItem('yuan.lang'); if (v === 'en' || v === 'zh') return v; } catch (e) {} return /^zh/i.test(navigator.language || '') ? 'zh' : 'en'; })();
const EN = LANG === 'en', L = (zh, en) => EN ? en : zh, lc = n => n === 'UFO' || n === 'Santa' ? n : n.startsWith('A!') ? 'A!' + n.slice(2).toLowerCase() : n.toLowerCase();
const N = 144, TAU = Math.PI * 2, DPHI = TAU / N;
const VMAX = 2600;      // 这个速度记为力度 100
const GRAV = 5200, FOLLOW = 20, ARM = 16, MIN_F = 4;
// K：圆度 = 1 - K * 半径变异系数；D0/D1：每一下的形变量 = 半径 * 松散 * (D0 + D1 * 窗口内位置)
const TUNE = { K: 3.5, D0: 0.05, D1: 0.2 };
const COS = new Float32Array(N), SIN = new Float32Array(N);
for (let i = 0; i < N; i++) { COS[i] = Math.cos(i * DPHI); SIN[i] = Math.sin(i * DPHI); }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const wrapPi = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const pct = v => Math.round(v * 100) + '%';
const C = { space: '#110d2b', hull: '#1e1747', hullHi: '#2d2468', rim: '#5143a0', ink: '#f4f0ff', dim: '#a9a1d6', alien: '#93e85a', coin: '#ffd35c', alarm: '#ff5683' };
const DISPLAY = "'ZCOOL KuaiLe','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif";
const BODY = "'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif";
const NUM = "Fredoka,'PingFang SC','Microsoft YaHei',sans-serif";
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!PORT) drawAlien(t);
  if (G.body && !G.body.dead) { drawLiftLine(G.body); drawBody(G.body, t); drawTalk(G.body); }
  if (G.doom) drawDoom(G.doom);
  drawFx(); if (SHOW_RING && G.body && !G.body.dead) drawForceRing(G.body); drawRotHint(); if (G.cele) drawCelebrate(t); ctx.restore();

}
/* 三颗星到手以后：画面四周一圈流动的彩虹光。一串光斑沿着边框顺时针转，一呼一吸，贴边闪小星星；

function drawEdgeGlow(t) {
  const on = G.tier >= 3 && (G.state === 'play' || G.state === 'result');
  G.glowK = (G.glowK || 0) + ((on ? 1 : 0) - (G.glowK || 0)) * .08;
  if (on !== !!G.glowOn) { G.glowOn = on; stage.classList.toggle('star3', on); }
  const k = G.glowK; if (k < .02) return;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const P = 2 * (VW + VH), n = 16, tt = REDUCED ? 0 : t, pulse = REDUCED ? 1 : .8 + .2 * Math.sin(tt * 3.2);
  const edge = s => { s = ((s % P) + P) % P; if (s < VW) return [s, 0]; s -= VW; if (s < VH) return [VW, s]; s -= VH; if (s < VW) return [VW - s, VH]; return [0, VH - (s - VW)]; };   // 沿边框走 s 这么远，走到哪儿
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const [x, y] = edge(i / n * P + tt * 150), r = 150, hue = (i / n * 360 + tt * 50) % 360, g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `hsla(${hue}, 100%, 62%, ${.48 * k * pulse})`); g.addColorStop(1, `hsla(${hue}, 100%, 62%, 0)`);

  if (REDUCED) return;

  for (let i = 0; i < 12; i++) {   // 小星星：每颗亮一下就换个地方，离边 10 到 40
    const c = t * .8 + i * .31, m = Math.floor(c), h1 = (Math.sin(m * 71.3 + i * 17.7) * 43758.5453 % 1 + 1) % 1, h2 = (Math.sin(m * 33.1 + i * 5.3) * 12543.123 % 1 + 1) % 1;
    const [x, y] = edge(h1 * P), inset = 10 + h2 * 30, cx = clamp(x, inset, VW - inset), cy = clamp(y, inset, VH - inset);
    ctx.globalAlpha = k; spark(ctx, cx, cy, 9 * Math.sin((c - m) * Math.PI));
  }

}

/* ---------- 缩放与主循环 ---------- */
let scale = 1;
function fit() {
  const aw = wrap.clientWidth, ah = wrap.clientHeight;
  PORT = ah > aw * 1.15;
  if (PORT) { VW = 540; BOT = 104; TOP = clamp(Math.round(VW * ah / aw) - H - BOT, 110, 300); VH = H + TOP + BOT; CAMX = WALL_R + 10 - VW; } else { VW = W; VH = H; TOP = 0; BOT = 0; CAMX = 0; }
  WALL_L = CAMX; stage.classList.toggle('port', PORT);
  let w = Math.floor(Math.min(aw, ah > 40 ? ah * VW / VH : aw, 1280)); if (!(w > 0)) w = 320;
  const h = Math.floor(w * VH / VW), dpr = Math.min(window.devicePixelRatio || 1, 2);
  stage.style.width = w + 'px'; stage.style.height = h + 'px'; stage.style.setProperty('--u', (w / VW) + 'px'); stage.style.setProperty('--bot', BOT);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); scale = cv.width / VW;
}
if (window.ResizeObserver) new ResizeObserver(fit).observe(wrap); else window.addEventListener('resize', fit);
fit();
if (TOUCH) { document.documentElement.classList.add('touch'); document.getElementById('help').textContent = '按住拎起来砸地板 · 另一根手指滑动来转'; }
if (EN) {
  document.documentElement.lang = 'en'; document.title = 'The Client Wants It Round';
  document.querySelector('meta[name="description"]').content = 'You are an Earth artisan abducted by an alien client: smash everything round. A 49-order whacking game.';
  document.getElementById('help').textContent = TOUCH
    ? 'Hold to lift, slam on the floor · Second finger slides to turn'
    : 'Hold to lift, slam on the floor · A / D to turn · Space delivers';
  deliverBtn.innerHTML = 'Deliver<span class="st"></span><kbd>Space</kbd>'; replayBtn.innerHTML = 'Retry<kbd>R</kbd>'; homeBtn.innerHTML = 'Home<kbd>Esc</kbd>'; muteBtn.textContent = 'Sound on';
  cv.setAttribute('aria-label', 'Game view: the material, the floor, the Client and the force gauge');
  document.getElementById('rotL').setAttribute('aria-label', 'Turn left'); document.getElementById('rotR').setAttribute('aria-label', 'Turn right');
}
try { if (document.fonts && document.fonts.load) { document.fonts.load(`20px 'ZCOOL KuaiLe'`, ORDER.map(id => MATS[id].name + MATS[id].over).join('') + '圆形程度力太轻磨好重击汽切皆足金舞曲烫急嗬疼0123456789%！'); document.fonts.load('700 20px Fredoka', '0123456789◎'); } } catch (e) {}
let last = 0;
function frame(now) { const dt = Math.min(.034, Math.max(0, (now - last) / 1000)); last = now; update(dt); draw(); requestAnimationFrame(frame); }

/* 调试与平衡用：模拟“每次都砸最凸的地方”要多少下 */
function sim(id, t, hits, aimErr) {
  const b = makeBody(id), m = b.mat, out = [Math.round(roundness(b.r) * 1000) / 10];
  for (let h = 0; h < (hits || 30); h++) {
    let bi = 0; for (let i = 1; i < N; i++) if (b.r[i] > b.r[bi]) bi = i;
    let tt = t;
    if (t === 'smart') { const want = (b.r[bi] - b.meanR) * .85 / (b.meanR * m.loose); tt = clamp((want - TUNE.D0) / TUNE.D1, 0, .95); }
    deform(b, bi * DPHI + rand(-1, 1) * (aimErr || 0), m.hard + (m.brittle - m.hard) * tt); out.push(Math.round(roundness(b.r) * 1000) / 10);
  }
  return { curve: out, keep: Math.round(b.area / b.area0 * 100) };
}
window.__yuan = { G, MATS, ORDER, P, TUNE, SAVE, ctx, makeBody, deform, sim, faceMat, act, startAt, tryGrab, release, deliver, update, draw, drawBody, roundness, updateRoundness, impact, starLines, A, ACH, achUnlock, showAch, tick(dt, n) { for (let k = 0; k < (n || 1); k++) update(dt); draw(); } };
/* 开场流程（播片 → 新手关 → 签合同）整个在 flow.js 里，这里只把它要用的东西递出去。删掉这一行或 flow.js 没加载，游戏就按原来的流程走 */
window.__yuanFlow = { SHAPES, ART, CHAPS, PARTS, sfx, audioInit, setCard, setupRound, setName, firstOpen, WHO, CLOUD, get NAME() { return NAME; }, get view() { return { scale, VW, VH, CAMX, TOP, BOT, PORT }; } };

function boot(data) {
  const back = achCheck(true) + (NAME && achUnlock('name_tag', true) ? 1 : 0);
  if (!A.bf) { A.bf = 1; A.bfN = back; achSave(); }
  if (data && typeof data.score === 'number' && data.idx >= 0 && data.idx < ORDER.length) { G.idx = data.idx; G.loop = data.loop || 0; G.score = data.score; G.done = data.done || 0; showOrder(); }
  else if (new URLSearchParams(location.search).get('lang')) showCover();   // 换完语言回到开始界面（开始界面就是首页）
  else showCover();
  requestAnimationFrame(now => { last = now; frame(now); });
  let ref = ''; try { const r = document.referrer && new URL(document.referrer).hostname; if (r && r !== location.hostname) ref = r; } catch (e) {}
  if (NAME) cloudSync(NAME).then(refreshCard).catch(() => {});
  TRACK('open', { lang: LANG, touch: TOUCH, port: PORT, w: innerWidth, h: innerHeight, dpr: devicePixelRatio || 1, ref, delivered: Object.keys(SAVE.best).length, stars: starTotal(), achN: Object.keys(A.got).length });
}
/* 关页面时还在做的那一单，记成中途放弃 */
addEventListener('pagehide', () => { if (G.state === 'play') { TRACK('quit', roundInfo()); achFlush(); } });
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => (G.state === 'menu' || G.state === 'cover' ? {} : { idx: G.idx, loop: G.loop, score: G.startScore, done: G.done })); } catch (e) {}
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
