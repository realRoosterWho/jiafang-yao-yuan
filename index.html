<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>甲方要圆</title>
<meta name="description" content="你是被外星甲方绑走的地球工匠：把所有东西砸成圆的。49 单敲击小游戏。">
<meta name="theme-color" content="#110d2b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2393e85a' stroke='%231e1747' stroke-width='3'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Fredoka:wght@500;700&display=swap">
<style>
/* 布局：单屏游戏。16:10 舞台居中占满可用空间，操作说明压在舞台下方一行。只做深色一套外观。 */
:root {
  color-scheme: dark;
  --space: #110d2b;    /* 深空底色 */
  --hull: #1e1747;     /* 舱壁、卡片 */
  --hull-hi: #2d2468;  /* 卡片里的内嵌面板 */
  --rim: #5143a0;      /* 描边 */
  --ink: #f4f0ff;      /* 正文 */
  --dim: #a9a1d6;      /* 次要文字 */
  --alien: #93e85a;    /* 甲方绿：达标、有效 */
  --coin: #ffd35c;     /* 酬劳、达标线 */
  --alarm: #ff5683;    /* 碎裂、失败 */
  --display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --num: "Fredoka", "PingFang SC", "Microsoft YaHei", sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  box-sizing: border-box;
  height: 100dvh;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--space);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  touch-action: manipulation; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; -webkit-touch-callout: none;
}
#app { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#wrap { flex: 1 1 0; min-height: 0; width: 100%; display: grid; place-items: center; }
* { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#stage {
  --u: 1px;
  position: relative;
  max-width: 100%;
  font-size: max(12px, calc(var(--u) * 16));
  border-radius: calc(var(--u) * 22);
  overflow: hidden;
  box-shadow: 0 0 0 2px var(--rim);
  background: var(--hull);
  user-select: none;
  -webkit-user-select: none;
}
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
#help { margin: 0; max-width: 72ch; font-size: 13px; line-height: 1.5; color: var(--dim); text-align: center; text-wrap: balance; }

#deliver {
  position: absolute; right: 10.5%; bottom: 2.6%;
  font: 400 max(13px, calc(var(--u) * 24))/1 var(--display);
  padding: .45em 1.1em; border: 0; border-radius: 999px;
  background: var(--alien); color: var(--space); cursor: pointer;
  animation: pulse 1s ease-in-out infinite alternate;
}
#deliver kbd { font: 500 .55em var(--num); opacity: .7; margin-left: .4em; }
#deliver .st { font: 400 .7em/1 var(--body); letter-spacing: .05em; margin-left: .45em; vertical-align: .08em; }
@keyframes pulse { to { box-shadow: 0 0 0 calc(var(--u) * 9) rgb(147 232 90 / .25); } }
#mute {
  position: absolute; left: 1.6%; bottom: 2.6%;
  font: 500 max(10px, calc(var(--u) * 13))/1 var(--body);
  padding: .5em .9em; border: 0; border-radius: 999px;
  background: transparent; color: var(--dim); box-shadow: inset 0 0 0 1px var(--rim); cursor: pointer;
}
#replay {
  position: absolute; left: 11.5%; bottom: 2.6%;
  font: 500 max(10px, calc(var(--u) * 13))/1 var(--body);
  padding: .5em .9em; border: 0; border-radius: 999px;
  background: transparent; color: var(--dim); box-shadow: inset 0 0 0 1px var(--rim); cursor: pointer;
}
#home {
  position: absolute; right: 10%; top: 16%;   /* 右上：圆度数字下面、力度表左边的空地。底部那排会被轮换的提示文字压到，顶部会碰到圆度数字 */
  font: 500 max(10px, calc(var(--u) * 13))/1 var(--body);
  padding: .5em .9em; border: 0; border-radius: 999px;
  background: transparent; color: var(--dim); box-shadow: inset 0 0 0 1px var(--rim); cursor: pointer;
}
#replay kbd, #home kbd { font: 500 .85em var(--num); opacity: .7; margin-left: .4em; }
.touch #replay kbd, .touch #home kbd { display: none; }
#replay:hover, #mute:hover, #home:hover { color: var(--ink); }
#deliver:focus-visible, #replay:focus-visible, #mute:focus-visible, #home:focus-visible, .btn:focus-visible { outline: 3px solid var(--coin); outline-offset: 3px; }

/* 卡片铺满整个视口而不是只铺舞台：窄屏时舞台很矮，卡片不能被舞台裁掉 */
#overlay {
  position: fixed; inset: 0; z-index: 5; display: flex; overflow: auto;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background: rgb(17 13 43 / .76);
  font-size: max(14px, calc(var(--u) * 16));
}
#card {
  box-sizing: border-box; margin: auto; width: min(100%, max(calc(var(--u) * 570), 26em));
  padding: 1.4em 1.7em 1.35em; display: flex; flex-direction: column; gap: .7em;
  background: var(--hull); border: 2px solid var(--rim); border-radius: 1.6em;
}
#card h1 { margin: 0; font: 400 3.1em/1 var(--display); letter-spacing: .05em; color: var(--alien); }
#card h2 { margin: 0; font: 400 1.9em/1.15 var(--display); text-wrap: balance; }
#card p { margin: 0; line-height: 1.6; }
#card p.why { padding: .6em .8em; border-radius: .6em; background: rgba(255,86,131,.12); box-shadow: inset 3px 0 0 var(--alarm); }
#card .red { color: var(--alarm); font-weight: 700; }
#card strong { color: var(--coin); font-weight: 600; }
.eyebrow { font-size: .8em; letter-spacing: .14em; color: var(--coin); }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: .5em; }
.how li { display: grid; grid-template-columns: auto 1fr; gap: .7em; align-items: start; line-height: 1.5; }
.how b {
  width: 1.55em; height: 1.55em; border-radius: 50%; display: grid; place-items: center;
  font: 400 1.2em/1 var(--display); background: var(--hull-hi); color: var(--coin);
}
.how span { min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: .7em; align-items: center; }
.btn {
  font: 400 1.3em/1 var(--display); padding: .55em 1.6em; border: 0; border-radius: 999px;
  background: var(--alien); color: var(--space); cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--rim); }
.spec {
  margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .4em 1.1em; align-items: center;
  padding: .8em 1em; border-radius: 1em; background: var(--hull-hi); font-size: .92em;
}
.spec dt { color: var(--dim); }
.spec dd { margin: 0; min-width: 0; font-variant-numeric: tabular-nums; }
.spec.tally dd { text-align: right; font-family: var(--num); }
.spec .sum { font-size: 1.5em; color: var(--coin); }
.window { display: flex; height: 1em; border-radius: 999px; overflow: hidden; }
.window i { display: block; }
.w-light { background: var(--rim); }
.w-ok { background: var(--alien); }
.w-break { background: var(--alarm); }
.pips { letter-spacing: .15em; color: var(--coin); margin-right: .5em; }
/* 星级 */
.nw { white-space: nowrap; }
.stars { color: var(--coin); letter-spacing: .08em; white-space: nowrap; font-family: var(--body); }
/* 结算卡：三颗星排成一道弧，中间那颗大一号；拿到的从 0 弹出来，带一圈光 */
#card.win { animation: cardin .38s cubic-bezier(.2, 1.3, .4, 1) both; box-shadow: 0 0 0 1px rgb(255 211 92 / .25), 0 1.2em 3em rgb(0 0 0 / .45); }
@keyframes cardin { from { transform: translateY(1.2em) scale(.94); opacity: 0; } }
.result { display: grid; justify-items: center; text-align: center; gap: .35em; }
.result h2 { margin-top: -.1em; }
.stars.big { display: flex; align-items: flex-end; justify-content: center; gap: .08em; margin: .1em 0 0; font-size: 3.4em; line-height: 1; letter-spacing: 0; }
.stars.big i { font-style: normal; color: var(--hull-hi); -webkit-text-stroke: 2px var(--rim); display: inline-block; }
.stars.big i:nth-child(2) { font-size: 1.32em; transform: translateY(-.12em); }
.stars.big i.on { color: var(--coin); -webkit-text-stroke: 0; text-shadow: 0 0 .25em rgb(255 211 92 / .55), 0 .06em 0 #c98a12; animation: starpop .5s cubic-bezier(.3, 1.7, .5, 1) both; animation-delay: calc(var(--k) * .18s); }
.stars.big i.on:nth-child(2) { animation-name: starpop2; }
@keyframes starpop { from { transform: scale(0) rotate(-50deg); opacity: 0; } }
@keyframes starpop2 { from { transform: translateY(-.12em) scale(0) rotate(-50deg); opacity: 0; } }
.rnd { color: var(--dim); font-size: .95em; }
.rnd b { font: 400 1.5em/1 var(--display); color: var(--alien); margin-left: .2em; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: .4em; }
.chip { padding: .2em .7em; border-radius: 999px; font-size: .85em; background: var(--hull-hi); color: var(--coin); box-shadow: inset 0 0 0 1.5px rgb(255 211 92 / .45); }
.chip.gold { background: var(--coin); color: var(--space); box-shadow: none; font-weight: 700; animation: chippop .5s .9s cubic-bezier(.3, 1.8, .5, 1) both; }
@keyframes chippop { from { transform: scale(0); } }
.spec .sum.done { animation: sumpop .3s ease-out; transform-origin: right center; }
@keyframes sumpop { 50% { transform: scale(1.18); color: #fff3b0; } }
.lv i { font-style: normal; font-size: .62em; line-height: 1; letter-spacing: .02em; color: var(--coin); min-height: 1em; }
.lv i.dim { color: var(--rim); }
.note { font-size: .85em; color: var(--dim); }
/* 排行榜 */
.board { margin: 0; padding: 0; list-style: none; display: grid; gap: .2em; max-height: min(52vh, 24em); overflow-y: auto; }
.board li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto auto; gap: .8em; align-items: center; padding: .45em .8em; border-radius: .8em; background: var(--hull-hi); font-variant-numeric: tabular-nums; }
.board li b { font: 400 1.15em/1 var(--display); color: var(--coin); text-align: center; }
.board li:nth-child(-n+3) b { font-size: 1.4em; }
.board .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .dl { color: var(--dim); font-size: .85em; }
.board .pt { font-family: var(--num); color: var(--coin); }
.board li.me { box-shadow: inset 0 0 0 2px var(--alien); }
.board.mine { max-height: none; }
/* 云存档 */
.who { display: grid; gap: .45em; margin: 0; }
.who-row { display: flex; gap: .5em; align-items: center; }
.who input {
  flex: 1 1 8em; min-width: 0; font: inherit; font-size: max(16px, 1em); padding: .5em .95em; border: 0; border-radius: 999px;
  background: var(--hull-hi); color: var(--ink); box-shadow: inset 0 0 0 2px var(--rim); -webkit-user-select: text; user-select: text;
}
.who input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--alien); }
.who input::placeholder { color: var(--dim); }
.btn.small { font-size: 1.05em; padding: .5em 1.2em; flex: none; }
.btn:disabled { opacity: .55; cursor: default; }
.who .err { color: var(--alarm); }
.link { font: inherit; padding: 0; border: 0; background: none; color: var(--alien); text-decoration: underline; text-underline-offset: .2em; cursor: pointer; }
/* 订单簿 */
.chap { font-size: .8em; letter-spacing: .1em; color: var(--dim); }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .3em; margin-top: -.4em; }
.lv {
  display: grid; justify-items: center; gap: .3em; min-width: 0; padding: .4em 0;
  border: 0; border-radius: .8em; background: transparent; color: var(--dim); font: inherit; cursor: pointer;
}
.lv b {
  width: 2.3em; height: 2.3em; border-radius: 50%; display: grid; place-items: center;
  font: 700 1em/1 var(--num); background: var(--hull-hi); box-shadow: inset 0 0 0 2px var(--rim);
}
.lv span { font-size: .75em; line-height: 1.2; white-space: nowrap; }
.lv.done { color: var(--ink); }
.lv.done b { background: var(--alien); color: var(--space); box-shadow: none; }
.lv.now b { color: var(--coin); box-shadow: inset 0 0 0 2px var(--coin); }
.lv:hover { background: var(--hull-hi); }
.lv:focus-visible { outline: 3px solid var(--coin); outline-offset: 1px; }
/* 触屏的微调角度：一只手拎着材料，另一只手按这两个键（或者在画面上左右滑） */
#rot { display: none; position: absolute; left: 2%; top: 56%; flex-direction: column; gap: calc(var(--u) * 14); }
#rot button {
  width: max(44px, calc(var(--u) * 64)); height: max(44px, calc(var(--u) * 64)); border-radius: 50%; border: 0; padding: 0;
  font: 400 max(22px, calc(var(--u) * 34))/1 var(--body); color: var(--ink); background: rgb(17 13 43 / .55);
  box-shadow: inset 0 0 0 1.5px var(--rim); opacity: .5; touch-action: none; user-select: none; -webkit-user-select: none;
}
#stage.held #rot button { opacity: 1; }
#rot button.on { background: var(--rim); }
/* 竖屏手机：舞台换成竖版，按钮跟着放大 */
#stage.port #deliver { right: 17%; bottom: calc(var(--u) * (var(--bot) + 8)); font-size: max(15px, calc(var(--u) * 30)); }
#stage.port #mute { bottom: calc(var(--u) * (var(--bot) + 10)); font-size: max(11px, calc(var(--u) * 17)); }
#stage.port #replay { left: 24%; bottom: calc(var(--u) * (var(--bot) + 10)); font-size: max(11px, calc(var(--u) * 17)); }
#stage.port #home { right: 2%; top: 14.8%; font-size: max(11px, calc(var(--u) * 17)); }   /* 竖屏：酬劳那行下面、甲方气泡右边 */
.touch #deliver kbd { display: none; }
#stage.cover #rot { display: none; }
@media (max-height: 520px) { #help { display: none; } body { padding-top: 6px; padding-bottom: 6px; } }
/* 成就：圆章没解锁是方的灰块，解锁了是圆的金章。提示条里那一下「方块被砸圆」就是解锁 */
.medal { flex: none; display: grid; place-items: center; width: 1.9em; height: 1.9em; border-radius: .32em; font: 700 .9em/1 var(--num); color: var(--dim);
  background: var(--hull); box-shadow: inset 0 0 0 2px var(--rim); }
.medal.on, #toast .medal { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, var(--coin) 45%, #d99a1c); box-shadow: inset 0 0 0 .2em rgb(255 255 255 / .25), inset 0 0 0 .32em rgb(122 82 0 / .35), 0 0 .6em rgb(255 211 92 / .35); }
#toast { box-sizing: border-box; position: absolute; z-index: 3; left: 46%; bottom: 2.2%; transform: translateX(-50%);
  display: flex; align-items: center; gap: .6em; max-width: calc(var(--u) * 420); padding: .38em 1.1em .38em .42em;
  border-radius: 999px; font: 400 max(12px, calc(var(--u) * 17))/1.15 var(--display); white-space: nowrap;
  background: rgb(30 23 71 / .95); color: var(--ink); box-shadow: inset 0 0 0 2px var(--coin), 0 6px 18px rgb(0 0 0 / .35); pointer-events: none; }
#toast .medal { width: 1.75em; height: 1.75em; }
#toast .tx { display: flex; align-items: baseline; gap: .55em; min-width: 0; }
#toast .tl { flex: none; font: 500 .62em var(--body); letter-spacing: .14em; color: var(--coin); }
#toast .tn { overflow: hidden; text-overflow: ellipsis; }
#toast .td { display: none; }
#stage.port #toast { left: 50%; bottom: auto; top: calc(var(--u) * 102); max-width: calc(var(--u) * 262); font-size: max(12px, calc(var(--u) * 16)); }
#stage.port #toast .medal { width: 1.5em; height: 1.5em; }
:lang(en) #stage.port #toast .tl { display: none; }
/* 不在干活时：钉在页面顶上，多一行描述 */
#stage #toast.menu, #stage.port #toast.menu { position: fixed; z-index: 6; top: max(12px, env(safe-area-inset-top, 0px)); bottom: auto; left: 50%;
  width: max-content; max-width: min(26em, calc(100vw - 32px)); font-size: 17px; white-space: normal; padding: .6em 1.3em .6em .6em; border-radius: 1.4em; }
#stage #toast.menu .medal, #stage.port #toast.menu .medal { width: 2.4em; height: 2.4em; }
#toast.menu .tx { flex-direction: column; align-items: flex-start; gap: .2em; }
#toast.menu .td { display: block; font: 400 .78em/1.45 var(--body); color: var(--dim); }
:lang(en) #stage.port #toast.menu .tl { display: inline; }
#toast.in { animation: achIn .26s cubic-bezier(.2, 1.4, .4, 1) both; }
#toast.in .medal { animation: stamp .42s .1s cubic-bezier(.3, 1.6, .5, 1) both; }
#toast.out { animation: achOut .28s ease-in both; }
@keyframes achIn { from { opacity: 0; transform: translate(-50%, 40%) scale(.9); } }
@keyframes achOut { to { opacity: 0; transform: translate(-50%, -30%); } }
@keyframes stamp { from { border-radius: .3em; background: var(--rim); box-shadow: none; transform: scale(1.6) rotate(-45deg); } }
/* 成就列表（成就页、结算卡上的「新成就」） */
.achs { margin: 0; padding: 0; list-style: none; display: grid; gap: .3em; }
.achs li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .75em; align-items: center; padding: .5em .8em; border-radius: .9em; background: var(--hull-hi); }
.achs li > span:not([class]) { display: grid; gap: .15em; min-width: 0; }
.achs .nm { font: 400 1.08em/1.2 var(--display); }
.achs .ds { font-size: .82em; line-height: 1.45; color: var(--dim); }
.achs .when, .achs .pg { font: 500 .78em var(--num); color: var(--dim); white-space: nowrap; }
.achs .bar { display: block; height: .3em; margin-top: .2em; border-radius: 999px; background: var(--hull); overflow: hidden; }
.achs .bar i { display: block; height: 100%; background: var(--coin); border-radius: inherit; }
.achs li:not(.on) .nm { color: var(--dim); }
.achs li.secret .ds { font-style: italic; }
.achs .new { font: 700 .55em/1 var(--body); font-style: normal; vertical-align: .35em; margin-left: .5em; padding: .2em .45em; border-radius: 999px; background: var(--alarm); color: #fff; }
.ach-new { display: grid; gap: .45em; }
.ach-new .achs li { box-shadow: inset 0 0 0 2px rgb(255 211 92 / .45); animation: achRow .45s cubic-bezier(.2, 1.3, .4, 1) both; animation-delay: calc(1.1s + var(--i) * .12s); }
.ach-new .achs li .medal { animation: stamp .45s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: calc(1.18s + var(--i) * .12s); }
@keyframes achRow { from { opacity: 0; transform: translateY(.6em); } }
.btn .cnt { font: 500 .7em var(--num); opacity: .75; }
.btn .dot { display: inline-block; width: .42em; height: .42em; margin-left: .35em; vertical-align: .5em; border-radius: 50%; background: var(--alarm); }
@media (prefers-reduced-motion: reduce) { #deliver, .stars.big i.on, #card.win, .chip.gold, .spec .sum.done, #toast.in, #toast.out, #toast .medal, .ach-new .achs li, .ach-new .achs li .medal { animation: none; } }
</style>
</head>
<body>

<main id="app">
  <div id="wrap">
    <div id="stage">
      <canvas id="cv" aria-label="游戏画面：材料、地板、甲方和力度表"></canvas>
      <button id="deliver" type="button" hidden>交货<span class="st"></span><kbd>空格</kbd></button>
      <button id="mute" type="button" aria-pressed="false">声音 开</button>
      <button id="replay" type="button" hidden>重来<kbd>R</kbd></button>
      <button id="home" type="button" hidden>回首页<kbd>Esc</kbd></button>
      <div id="toast" role="status" aria-live="polite" hidden></div>
      <div id="rot"><button id="rotL" type="button" aria-label="向左转">↺</button><button id="rotR" type="button" aria-label="向右转">↻</button></div>
      <div id="overlay" hidden><section id="card"></section></div>
    </div>
  </div>
  <p id="help">按住拎起来砸地板 · A / D 转 · 空格交货</p>
</main>

<script>
(() => {
'use strict';

/* ---------- 常量 ---------- */
const W = 960, H = 600, FLOOR = 520, WALL_R = 880;
