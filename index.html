<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>甲方要圆</title>
<meta name="description" content="你是被外星甲方绑走的地球工匠：把所有东西砸成圆的。48 单敲击小游戏。">
<meta name="theme-color" content="#211a72">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c6f1fb' stroke='%231b1340' stroke-width='3'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Fredoka:wght@500;700&display=swap">
<style>
/* 布局：单屏游戏。16:10 舞台居中占满可用空间，操作说明压在舞台下方一行。
   画风：平涂色块 + 一圈深色粗描边 + 实心投影，不用渐变和虚化。卡片是白纸底、深色字。 */
:root {
  color-scheme: light;
  --space: #211a72;    /* 舞台外面的底色 */
  --hull: #fffdf5;     /* 卡片：白纸 */
  --hull-hi: #efeaff;  /* 卡片里的内嵌面板 */
  --rim: #1b1340;      /* 描边 */
  --ink: #1b1340;      /* 正文 */
  --dim: #6c6494;      /* 次要文字 */
  --alien: #5fd66a;    /* 达标、有效、主按钮 */
  --coin: #ffc928;     /* 酬劳、奖章 */
  --alarm: #ff4f7d;    /* 碎裂、失败 */
  --hot: #e8336d;      /* 强调字 */
  --blue: #3b46f0;     /* 小标题、链接 */
  --line: max(2px, calc(var(--u, 1px) * 3.5));   /* 描边粗细，跟着舞台缩放 */
  --display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --num: "Fredoka", "PingFang SC", "Microsoft YaHei", sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  box-sizing: border-box;
  height: 100dvh;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--space);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  touch-action: manipulation; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; -webkit-touch-callout: none;
}
#app { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#wrap { flex: 1 1 0; min-height: 0; width: 100%; display: grid; place-items: center; }
* { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#stage {
  --u: 1px;
  position: relative;
  max-width: 100%;
  font-size: max(12px, calc(var(--u) * 16));
  border-radius: calc(var(--u) * 22);
  overflow: hidden;
  box-shadow: 0 0 0 max(3px, calc(var(--u) * 4)) var(--ink);
  background: #2f3be6;
  user-select: none;
  -webkit-user-select: none;
}
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
#help { margin: 0; max-width: 72ch; font-size: 13px; line-height: 1.5; color: #cfc9f5; text-align: center; text-wrap: balance; }

/* 舞台上的按钮：白底、粗描边、底下一道实心投影 */
#deliver, #mute, #replay, #home {
  position: absolute; box-sizing: border-box; border: var(--line) solid var(--ink); border-radius: 999px;
  color: var(--ink); cursor: pointer; box-shadow: 0 calc(var(--u) * 4) 0 var(--ink);
}
#deliver {
  right: 10.5%; bottom: 3%;
  font: 400 max(13px, calc(var(--u) * 24))/1 var(--display);
  padding: .42em 1.1em; background: var(--alien);
  animation: hop .42s ease-in-out infinite alternate;
}
#deliver kbd { font: 500 .55em var(--num); opacity: .7; margin-left: .4em; }
@keyframes hop { to { transform: translateY(calc(var(--u) * -6)); } }
#mute, #replay, #home {
  font: 600 max(10px, calc(var(--u) * 13))/1 var(--body);
  padding: .5em .9em; background: var(--hull);
}
#mute { left: 1.6%; bottom: 3%; }
#replay { left: 11.5%; bottom: 3%; }
#home { right: 10%; top: 16.6%; }   /* 右上：圆度面板下面、力度表左边的空地 */
#replay kbd, #home kbd { font: 500 .85em var(--num); opacity: .6; margin-left: .4em; }
.touch #replay kbd, .touch #home kbd { display: none; }
#replay:hover, #mute:hover, #home:hover { background: #fff3c4; }
#deliver:active, #mute:active, #replay:active, #home:active { transform: translateY(calc(var(--u) * 3)); box-shadow: 0 calc(var(--u) * 1) 0 var(--ink); animation: none; }
#deliver:focus-visible, #replay:focus-visible, #mute:focus-visible, #home:focus-visible, .btn:focus-visible { outline: 3px solid var(--hot); outline-offset: 3px; }

/* 卡片铺满整个视口而不是只铺舞台：窄屏时舞台很矮，卡片不能被舞台裁掉 */
#overlay {
  position: fixed; inset: 0; z-index: 5; display: flex; overflow: auto;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px));
  background: rgb(27 19 64 / .6);
  font-size: max(14px, calc(var(--u) * 16));
}
#card {
  box-sizing: border-box; margin: auto; width: min(100%, max(calc(var(--u) * 570), 26em));
  padding: 1.4em 1.7em 1.5em; display: flex; flex-direction: column; gap: .7em;
  background: var(--hull); border: max(3px, calc(var(--u) * 4)) solid var(--ink); border-radius: 1.6em;
  box-shadow: 0 .5em 0 var(--ink);
}
#card.wide { width: min(100%, max(calc(var(--u) * 760), 26em)); }
#card h1 {
  margin: 0; font: 400 3.1em/1.1 var(--display); letter-spacing: .05em; color: var(--alien);
  -webkit-text-stroke: .11em var(--ink); paint-order: stroke fill; text-shadow: .05em .07em 0 var(--ink);
}
#card h2 { margin: 0; font: 400 1.9em/1.15 var(--display); text-wrap: balance; }
#card p { margin: 0; line-height: 1.6; }
#card strong { color: var(--hot); font-weight: 700; }
.eyebrow { font-size: .8em; font-weight: 700; letter-spacing: .14em; color: var(--blue); }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: .5em; }
.how li { display: grid; grid-template-columns: auto 1fr; gap: .7em; align-items: start; line-height: 1.5; }
.how b {
  width: 1.55em; height: 1.55em; border-radius: 50%; display: grid; place-items: center; box-sizing: border-box;
  font: 400 1.2em/1 var(--display); background: var(--coin); color: var(--ink); border: 2.5px solid var(--ink);
}
.how span { min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: .7em; align-items: center; padding-bottom: .25em; }
.btn {
  font: 400 1.3em/1 var(--display); padding: .5em 1.5em; border: .13em solid var(--ink); border-radius: 999px;
  background: var(--alien); color: var(--ink); cursor: pointer; box-shadow: 0 .2em 0 var(--ink);
}
.btn.ghost { background: #fff; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost:hover { background: #fff3c4; filter: none; }
.btn:active { transform: translateY(.14em); box-shadow: 0 .06em 0 var(--ink); }
.spec {
  margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .4em 1.1em; align-items: center;
  padding: .8em 1em; border-radius: 1em; background: var(--hull-hi); border: 2.5px solid var(--ink); font-size: .92em;
}
.spec dt { color: var(--dim); }
.spec dd { margin: 0; min-width: 0; font-variant-numeric: tabular-nums; }
.spec.tally dd { text-align: right; font-family: var(--num); font-weight: 500; }
.spec .sum { font-size: 1.5em; font-weight: 700; color: var(--hot); }
.window { display: flex; height: 1em; border-radius: 999px; overflow: hidden; border: 2px solid var(--ink); }
.window i { display: block; }
.w-light { background: #cfc7ee; }
.w-ok { background: var(--alien); }
.w-break { background: var(--alarm); }
.pips { letter-spacing: .15em; color: var(--blue); margin-right: .5em; }
.note { font-size: .85em; color: var(--dim); }
/* 排行榜 */
.board { margin: 0; padding: 0; list-style: none; display: grid; gap: .25em; max-height: min(52vh, 24em); overflow-y: auto; }
.board li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto auto; gap: .8em; align-items: center; padding: .45em .8em; border-radius: .8em; background: var(--hull-hi); font-variant-numeric: tabular-nums; }
.board li b { font: 400 1.15em/1 var(--display); color: var(--hot); text-align: center; }
.board li:nth-child(-n+3) b { font-size: 1.4em; }
.board .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .dl { color: var(--dim); font-size: .85em; }
.board .pt { font-family: var(--num); font-weight: 700; }
.board li.me { background: #d6f8d0; box-shadow: inset 0 0 0 2.5px var(--ink); }
.board.mine { max-height: none; }
/* 云存档 */
.who { display: grid; gap: .45em; margin: 0; }
.who-row { display: flex; gap: .5em; align-items: center; }
.who input {
  flex: 1 1 8em; min-width: 0; font: inherit; font-size: max(16px, 1em); padding: .5em .95em; border: 0; border-radius: 999px;
  background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2.5px var(--ink); -webkit-user-select: text; user-select: text;
}
.who input:focus { outline: none; box-shadow: inset 0 0 0 3px var(--blue); }
.who input::placeholder { color: var(--dim); }
.btn.small { font-size: 1.05em; padding: .5em 1.2em; flex: none; }
.btn:disabled { opacity: .55; cursor: default; }
.who .err { color: var(--hot); }
.link { font: inherit; padding: 0; border: 0; background: none; color: var(--blue); text-decoration: underline; text-underline-offset: .2em; cursor: pointer; }
/* 订单簿：一班一列，班号在上，下面六个图标格子；交付过的右上角挂一枚金币 */
.book {
  display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: .9em .55em;
  padding: 1em .9em .9em; border-radius: 1.1em; border: 3px solid var(--ink); background: #2f3be6;
  /* 横屏时按视口高度收窄：七行格子一屏放得下，不用滚 */
  box-sizing: border-box; width: min(100%, max(24em, calc((100dvh - 14.5em) * 1.1))); margin: 0 auto;
}
.bookhead { display: flex; align-items: center; justify-content: space-between; gap: 1em; }
.bookhead > div { display: grid; gap: .3em; min-width: 0; }
.col { display: grid; gap: .5em; align-content: start; }
.hd, .tile { position: relative; box-sizing: border-box; aspect-ratio: 1; border: 2.5px solid var(--ink); border-radius: .55em; }
.hd { display: grid; place-items: center; background: linear-gradient(135deg, var(--c1) 50%, var(--c2) 50%); }
.hd b { font: 700 2em/1 var(--num); color: #fff; -webkit-text-stroke: .2em var(--ink); paint-order: stroke fill; }
.tile { padding: 0; cursor: pointer; background: linear-gradient(165deg, var(--c2) 58%, var(--c1) 58%); font: inherit; }
.tile img { display: block; width: 100%; height: 100%; pointer-events: none; }
.tile .medal {
  position: absolute; right: -.45em; top: -.45em; width: 1.2em; height: 1.2em; box-sizing: border-box; border-radius: 50%;
  background: var(--coin); border: 2px solid var(--ink); box-shadow: inset 0 0 0 .14em #fff1a8, inset 0 0 0 .22em #e89a00;
}
.tile:hover, .tile:focus-visible { transform: translateY(-.12em) scale(1.06); outline: none; box-shadow: 0 0 0 3px #fff; z-index: 1; }
.tile:active { transform: scale(.96); }
.tile.now::after {   /* 该做的下一单：四个角一蹦一蹦的框 */
  content: ""; position: absolute; inset: -.42em; pointer-events: none; border-radius: .5em;
  background:
    linear-gradient(var(--alien) 0 0) left top / 32% .26em, linear-gradient(var(--alien) 0 0) left top / .26em 32%,
    linear-gradient(var(--alien) 0 0) right top / 32% .26em, linear-gradient(var(--alien) 0 0) right top / .26em 32%,
    linear-gradient(var(--alien) 0 0) left bottom / 32% .26em, linear-gradient(var(--alien) 0 0) left bottom / .26em 32%,
    linear-gradient(var(--alien) 0 0) right bottom / 32% .26em, linear-gradient(var(--alien) 0 0) right bottom / .26em 32%;
  background-repeat: no-repeat; animation: aim .5s ease-in-out infinite alternate;
}
@keyframes aim { to { inset: -.2em; } }
.tip { min-height: 1.6em; font-weight: 700; }
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .5em; }
.strip .tile { cursor: default; transform: none; box-shadow: none; }
@media (max-width: 620px) { .book { grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; } }
/* 触屏的微调角度：一只手拎着材料，另一只手按这两个键（或者在画面上左右滑） */
#rot { display: none; position: absolute; left: 2%; top: 56%; flex-direction: column; gap: calc(var(--u) * 14); }
#rot button {
  width: max(44px, calc(var(--u) * 64)); height: max(44px, calc(var(--u) * 64)); border-radius: 50%; padding: 0;
  font: 400 max(22px, calc(var(--u) * 34))/1 var(--body); color: var(--ink); background: var(--hull);
  border: var(--line) solid var(--ink); opacity: .55; touch-action: none; user-select: none; -webkit-user-select: none;
}
#stage.held #rot button { opacity: 1; }
#rot button.on { background: var(--coin); }
/* 竖屏手机：舞台换成竖版，按钮跟着放大 */
#stage.port #deliver { right: 17%; bottom: calc(var(--u) * (var(--bot) + 8)); font-size: max(15px, calc(var(--u) * 30)); }
#stage.port #mute { bottom: calc(var(--u) * (var(--bot) + 10)); font-size: max(11px, calc(var(--u) * 17)); }
#stage.port #replay { left: 24%; bottom: calc(var(--u) * (var(--bot) + 10)); font-size: max(11px, calc(var(--u) * 17)); }
#stage.port #home { right: 2%; top: calc(var(--u) * 146); font-size: max(11px, calc(var(--u) * 17)); }   /* 竖屏：顶栏下面的右上角 */
.touch #deliver kbd { display: none; }
#stage.cover #rot { display: none; }
@media (max-height: 520px) { #help { display: none; } body { padding-top: 6px; padding-bottom: 6px; } }
@media (prefers-reduced-motion: reduce) { #deliver, .tile.now::after { animation: none; } }
</style>
</head>
<body>

<main id="app">
  <div id="wrap">
    <div id="stage">
      <canvas id="cv" aria-label="游戏画面：材料、地板、甲方和力度表"></canvas>
      <button id="deliver" type="button" hidden>交货<kbd>空格</kbd></button>
      <button id="mute" type="button" aria-pressed="false">声音 开</button>
      <button id="replay" type="button" hidden>重来<kbd>R</kbd></button>
      <button id="home" type="button" hidden>回首页<kbd>Esc</kbd></button>
      <div id="rot"><button id="rotL" type="button" aria-label="向左转">↺</button><button id="rotR" type="button" aria-label="向右转">↻</button></div>
      <div id="overlay" hidden><section id="card"></section></div>
    </div>
  </div>
  <p id="help">按住材料拎起来往地板上砸，或者举高了松手。抓住一头，对面那头朝下；A / D 或滚轮微调角度，空格交货。</p>
</main>

<script>
(() => {
'use strict';

/* ---------- 常量 ---------- */
const W = 960, H = 600, FLOOR = 520, WALL_R = 880;
// 竖屏时只看世界的右半边（房间变窄、力度表还在右侧），顶上多出 TOP 高的一条放甲方和圆度条
let WALL_L = 0, PORT = false, VW = W, VH = H, CAMX = 0, TOP = 0, BOT = 0;   // BOT：竖屏底部放横版力度表的一条，拎材料的手不会挡住
const midX = () => (WALL_L + WALL_R) / 2;
// 触屏判断：有的手机浏览器不报 hover:none，所以再看触点数，只要没有精确指针（鼠标）就当触屏
const mq = q => !!(window.matchMedia && matchMedia(q).matches);
const TOUCH = mq('(hover: none) and (pointer: coarse)') || ((navigator.maxTouchPoints > 0 || 'ontouchstart' in window) && !mq('(hover: hover) and (pointer: fine)'));
// 语言：网址里的 ?lang= 优先，其次是上次选的，最后看浏览器语言。L(中文, 英文) 就地取词
const LANG = (() => { try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'zh') return q; const v = localStorage.getItem('yuan.lang'); if (v === 'en' || v === 'zh') return v; } catch (e) {} return /^zh/i.test(navigator.language || '') ? 'zh' : 'en'; })();
const EN = LANG === 'en', L = (zh, en) => EN ? en : zh, lc = n => n === 'UFO' || n === 'Santa' ? n : n.startsWith('A!') ? 'A!' + n.slice(2).toLowerCase() : n.toLowerCase();
const N = 144, TAU = Math.PI * 2, DPHI = TAU / N;
const VMAX = 2600;      // 这个速度记为力度 100
const GRAV = 5200, FOLLOW = 20, ARM = 16, MIN_F = 4;
// K：圆度 = 1 - K * 半径变异系数；D0/D1：每一下的形变量 = 半径 * 松散 * (D0 + D1 * 窗口内位置)
const TUNE = { K: 3.5, D0: 0.05, D1: 0.2 };
const COS = new Float32Array(N), SIN = new Float32Array(N);
for (let i = 0; i < N; i++) { COS[i] = Math.cos(i * DPHI); SIN[i] = Math.sin(i * DPHI); }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const wrapPi = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const pct = v => Math.round(v * 100) + '%';
const C = { space: '#110d2b', hull: '#1e1747', hullHi: '#2d2468', rim: '#5143a0', ink: '#f4f0ff', dim: '#a9a1d6', alien: '#93e85a', coin: '#ffd35c', alarm: '#ff5683' };
const INK = '#1b1340', INK2 = '#6c6494', PAPER = '#fffdf5';   // 描边和面板上的字 / 面板上的次要字 / 面板的白纸底
const DISPLAY = "'ZCOOL KuaiLe','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif";
const BODY = "'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif";
const NUM = "Fredoka,'PingFang SC','Microsoft YaHei',sans-serif";
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 材质 ----------
   hard    硬度：力度达到它才会变形
   brittle 易碎：力度超过它就碎一次
   loose   松散：每一下改变形状的程度
   plastic 0 = 掉渣（少料），1 = 不少料、往两边鼓
   value   价值系数
   一种材料就是一单。要加新的一单：这里加一条，SHAPES 里加起始形状，ART 里加贴图，再把名字排进 ORDER。
   可选：snd 借用别的敲击声，wet 溅汁水，rough 轮廓毛糙，rnd 随机形状可接受的起始圆度范围 */
const MATS = {
  wood: { name: '木头', unit: '块', hard: 22, brittle: 80, loose: 1.0, plastic: 0, smooth: 0, passes: 0, value: 1.0, hp: 3, rest: .28, fric: .7, accel: 30000, jig: .04, target: .80, time: 90,
    base: '#b9824a', outline: '#4f2e12', chips: ['#c99355', '#8a5a2b', '#e3ba82'], over: '劈裂了！', dead: '木头被砸成了一堆柴火。', blurb: '脾气最好的材料，力度窗口很宽，拿来热身。' },
  stone: { name: '石头', unit: '块', hard: 42, brittle: 86, loose: .8, plastic: 0, smooth: 0, passes: 0, value: 1.5, hp: 3, rest: .2, fric: .8, accel: 17000, jig: 0, target: .82, time: 90, rnd: [.5, .66], rough: 1.3,

  bonbon: ['Liqueur Chocolate', 'Chocolate chipped!', 'The filling drained out, leaving a puddle of chocolate. The Client licked it and said round is optional, but so is paying.', 'Square, thin shell, narrow window. Rounding the corners will reach the filling, and the filling splashes at almost any touch. Finesse on the shell, feather taps once it shows.'],
  earth: ['Earth', 'Earthquake!', 'Earth broke. Your home is gone, but the Client says the new one will be rounder.', 'The Client measured it: your home is not round enough. Mountains too tall, trenches too deep. Flatten them. The crust is thin with magma right under it, so once you are through, be gentle.'],
  butter: ['Butter', 'Squashed flat!', 'The butter is now a sheet glued to the floor. The Client says it is perfect for polishing shoes.', 'A long, soft block of butter. Stand it up and it sinks and spreads; lay it flat and it stays put. Set a corner down and that corner flattens itself. Use hitting and slumping together.'],
  copper: ['Copper', 'Cracked!', 'The copper split into pieces. Copper is supposed to be tough. How did you manage that?', 'Copper hardens as you hit it. Every good hit raises the bottom of the force window, and the green band keeps shrinking. Do not waste hits on flat sides. Go for the biggest corner.'],

  rebar: ['Rebar', 'Bent!', 'The rebar snapped. Someone at a building site is looking everywhere for it.', 'A long steel bar. Hold one end and the other points down: hitting the ends upright makes it shorter and thicker, which smiths call upsetting. Steel hardens too, so each hit must be heavier than the last.'],
  slime: ['Slime', 'Slime burst!', 'The slime split into lots of little slimes, all running away.', 'A blob of slime with several tentacles that oozes downward if you leave it. It will watch you. Ignore it. Set a tentacle down and it will pull itself back in.'],
  weight: ['Steelyard Weight', 'Chipped!', 'The weight chipped. The Client says they will weigh things by feel from now on.', 'A cast-iron weight with a knob on top and a wide flat base. Iron hardens as you hit it, so plan ahead: the knob sticks out most, but the two bottom corners need work too.'],
  clay: ['Modelling Clay', 'Squashed!', 'The clay is now a thin sheet stuck to the floor.', 'Straight out of the fridge and too stiff to dent. Hold it in your hand for a while: the longer you hold it, the softer it gets, and each hit takes off a big chunk. It cannot break, so experiment.'],
  sandbag: ['Sandbag', 'Bag torn!', 'The sandbag split and sand went everywhere. The Client says it makes a nice beach.', 'A half-full bag of sand, and the sand flows downward. Hit the empty cloth side and it just flops; only the side with sand behind it changes shape. After flipping it, wait for the sand to settle. The gauge shows whether sand or nothing is facing down.'],
  choco: ['Chocolate', 'Chipped!', 'The chocolate is now crumbs. The Client says they are perfect on ice cream.', 'Cold chocolate is brittle: narrow window, small chips, good for fine work. Warm it in your hand and the window widens and each hit does more, but once you put it down it melts and slumps. Just do not overheat it: too hot and it melts, breaking at a touch, and you must put it down to cool.'],

/* ---------- 物理 ---------- */
function resolve(b, cx, cy, nx, ny, e, mu) {

  const vt = vcx * tx + vcy * ty, rt = rx * ty - ry * tx;

function stepBody(b, dt) {

    let ax = dvx - b.vx, ay = dvy - b.vy; const al = Math.hypot(ax, ay), mx = m.accel * dt;
    if (al > mx) { ax *= mx / al; ay *= mx / al; }
    b.vx += ax; b.vy += ay; b.x += b.vx * dt; b.y += b.vy * dt;
    let maxY = -1e9, minX = 1e9, maxX = -1e9, lowX = b.x;
    for (let i = 0; i < N; i++) {
      const lx = b.r[i] * COS[i], ly = b.r[i] * SIN[i], wx = b.x + lx * c - ly * s, wy = b.y + lx * s + ly * c;
      if (wy > maxY) { maxY = wy; lowX = wx; } if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
    }
    if (minX < WALL_L) { b.x += WALL_L - minX; lowX += WALL_L - minX; if (b.vx < 0) b.vx = 0; }
    if (maxX > WALL_R) { b.x -= maxX - WALL_R; lowX -= maxX - WALL_R; if (b.vx > 0) b.vx = 0; }
    b.lowX = lowX;
    const pen = maxY - FLOOR;

  }

}

/* ---------- 敲击结算 ---------- */
function impact(b, F, cx) {
  const m = b.mat; F = Math.min(F, 100);
  const primary = b.held || b.primary; if (!b.held) b.primary = false;
  const power = F / 100;
  if (G.state !== 'play') { sfx.thud(power); dust(cx, 3); return; }
  const lm = faceMat(b);
  if (F < lm.hard) {
    sfx.thud(.4 + power); dust(cx, 2 + F * .08); b.jigV += power * m.jig * 6;
    if (primary) {
      G.lastHit = { F, t: G.time, kind: 'light' }; G.stats.light++;
      floatText(cx, FLOOR - 46, L('太轻 ', 'Too soft ') + Math.round(F), C.dim, 20);
      if (Math.random() < .45) say('light');
    }
    return;
  }
  const res = deform(b, Math.PI / 2 - b.a, F);
  snapToFloor(b);
  const keepV = m.bounce || .45; b.vx *= keepV; b.vy *= keepV; b.w *= keepV; b.jigV += power * m.jig * 16; b.flash = res.over ? .8 : .25;
  G.shake = Math.max(G.shake, res.over ? 15 : 3 + 9 * power);
  G.lastHit = { F, t: G.time, kind: res.over ? 'over' : 'good' };
  const n = res.over ? 26 : Math.round(6 + 12 * res.t);
  burst(cx, lm.plastic ? Math.round(n * .5) : n, lm.chips, power, lm.wet ? 'drop' : 'chip'); dust(cx, 4 + 6 * power);
  if (MATFX[b.id]) MATFX[b.id](cx, power, res.over, b, res.core);
  HIT[lm.snd || b.id](.45 + .55 * power);
  if (b.c && !res.core && faceMat(b).isCore) floatText(cx, FLOOR - 92, L('露出', 'Exposed: ') + L(m.core.label[0], lc(m.core.label[1])) + L('了', ''), C.coin, 22);
  const before = G.round; updateRoundness(); const gain = G.round - before;
  if (res.over) {
    G.hp--; G.stats.over++; (m.flee ? sfx.huff : sfx.crack)(); mood('angry', 2.2);
    floatText(cx, FLOOR - 56, lm.over, C.alarm, 28);
    if (G.hp <= 0) { shatter(b); return; }
    say('over', true);
  } else {
    G.stats.good++;
    if (m.harden && !lm.isCore) {
      const old = b.hardAdd || 0; b.hardAdd = Math.min(m.brittle - (m.minWin || 10) - m.hard, old + m.harden);
      if (b.hardAdd > old) floatText(cx, FLOOR - 84, L('变硬 → ', 'Harder → ') + Math.round(m.hard + b.hardAdd), C.dim, 16);
    }
    const word = res.t < .3 ? L('轻磨', 'Graze') : res.t < .75 ? L('好', 'Good') : L('重击', 'Smash');
    floatText(cx, FLOOR - 50, word + ' ' + Math.round(F), gain >= 0 ? C.alien : C.coin, 22);
    if (gain < -.012) say('worse'); else if (Math.random() < .3) say('good');
  }
}
function updateRoundness() {
  G.round = roundness(G.body.r);
  const ready = G.round >= G.target;
  if (ready && !G.wasReady && G.state === 'play') { sfx.ready(); say('ready', true); mood('happy', 3); }
  G.wasReady = ready; deliverBtn.hidden = !(ready && G.state === 'play');
}
function shatter(b) {
  if (b.mat.flee) {   // 活的：急够了站直了就跑，不碎
    b.held = false; b.flee = true; b.fleeT = 0; let lo = 0; for (let i = 0; i < N; i++) lo = Math.max(lo, b.r[i] * SIN[i]); b.fleeY = FLOOR - lo;
    sfx.huff(); [0, .12, .24].forEach(d => tone(520, .1, .16, 'square', 900, d)); G.shake = 10;
    fail('shatter'); say('flee', true); return;
  }
  b.dead = true; b.held = false; sfx.shatter(); G.shake = 24;
  if (b.mat.floor) {   // 碎的是地板：砸出一个洞，东西连同你一起掉下去
    const x0 = clamp(b.lowX, WALL_L + 80, WALL_R - 80);
    for (let f = 0; f < 9; f++) { const s = rand(10, 22); frags.push({ pts: [[-s, -s * .6], [s * .8, -s * .7], [s, s * .5], [-s * .6, s * .8]], x: x0 + rand(-70, 70), y: FLOOR + 4, a: rand(0, TAU), vx: rand(-280, 280), vy: rand(-620, -280), w: rand(-8, 8), c: pick(['#2a2166', '#3d3190', '#7566db']), o: '#1e1747' }); }
    stain(x0, 110, '#05030f', 6); burst(x0, 24, ['#2a2166', '#7566db', '#cfc8f0'], 1, 'chip');
    fail('shatter'); return;
  }

    const mid = (i0 + i1) / 2 * DPHI + b.a, sp = rand(160, 460);
    frags.push({ pts, x: b.x, y: b.y, a: b.a, vx: Math.cos(mid) * sp + b.vx * .2, vy: Math.sin(mid) * sp - 260, w: rand(-7, 7), c: pick(b.mat.chips), o: b.mat.outline });
    i0 = i1;
  }
  burst(b.x, 30, b.mat.chips, 1, 'chip', b.y);
  if (b.id === 'egg') { stain(b.x, 120, 'rgba(255,251,240,.92)', 5); stain(b.x + rand(-20, 20), 30, '#ffc21f', 11); fxp(b.x, FLOOR - 8, 16, 'drop', ['#ffcf40', '#fffaf0'], { v0: 120, v1: 420, s0: 4, s1: 9 }); }
  fail('shatter');
}

/* ---------- 粒子与飘字 ---------- */

    const a = rand(-Math.PI, 0), sp = rand(60, 280) * (.5 + power);
    parts.push({ x: x + rand(-8, 8), y: (y === undefined ? FLOOR : y) - 3, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70, life: rand(.45, .95), t: 0, s: rand(2.5, 6.5), c: pick(colors), rot: rand(0, TAU), vr: rand(-12, 12), kind });
  }
}
function dust(x, n) {
  for (let k = 0; k < n && parts.length < 320; k++) parts.push({ x: x + rand(-14, 14), y: FLOOR - 2, vx: rand(-90, 90), vy: rand(-40, -6), life: rand(.35, .6), t: 0, s: rand(5, 12), c: '#cfc8f0', rot: 0, vr: 0, kind: 'dust' });
}
function fxp(x, y, n, kind, colors, o) {

    const a = rand(-Math.PI, 0), sp = rand(o.v0 || 60, o.v1 || 280);
    parts.push({ x: x + rand(-10, 10), y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up === undefined ? 70 : o.up), life: rand(.45, .95) * (o.life || 1), t: 0, s: rand(o.s0 || 2.5, o.s1 || 6.5), c: pick(colors), rot: rand(0, TAU), vr: rand(-12, 12), kind, g: o.g, ch: o.ch && pick(o.ch) });
  }
}
function puff(x, n, c) { for (let k = 0; k < n && parts.length < 320; k++) parts.push({ x: x + rand(-22, 22), y: FLOOR - rand(2, 16), vx: rand(-130, 130), vy: rand(-70, -10), life: rand(.5, .9), t: 0, s: rand(8, 17), c, rot: 0, vr: 0, kind: 'dust', a: .5 }); }

/* 每种材料自己的敲击特效：(落点 x, 力度 0..1, 是否过头, 材料) */

    if (over) { fxp(x, FLOOR - 4, 20, 'drop', ['#ffffff', '#f3d9b8', '#b9773a'], { v0: 200, v1: 520, up: 160 }); stain(x, 80, 'rgba(150,90,40,.5)'); }
  },
  pc: (x, p, over) => fxp(x, FLOOR - 12, over ? 9 : 2 + 3 * p, 'glyph', ['#7dff9a'], { ch: over ? ['ERR', '?!', '404'] : ['0', '1'], s0: 13, s1: 19, g: 420, v0: 80, v1: 240, up: 170, life: 1.4 }),
  gem: (x, p, over) => { twinkle(x, FLOOR - 10, 3 + 4 * p, ['#ffffff', '#9ff3ff']); if (over) shards(x, 10, ['#9ff3ff', '#ffffff']); },
  dough: (x, p) => puff(x, 5 + 8 * p, '#fffaf0'),

  carrot: (x, p) => fxp(x, FLOOR - 6, 2 + 3 * p, 'slice', ['#f08a24', '#ffa544'], { s0: 6, s1: 10, v0: 100, v1: 320 }),
  ice: (x, p, over, b) => { shards(x, 3 + 5 * p, ['#eaffff', '#bfe9fb']); puff(x, 3, '#dff6ff'); stain(b.x, 26 + 30 * p, 'rgba(160,220,250,.32)'); },
  egg: (x, p, over, b) => {
